name: Build LucyMC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lucymc-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate ephemeral keystore
        run: |
          keytool -genkeypair -keystore lucymc-test.jks -keyalg RSA -keysize 2048 \
            -validity 3650 -alias lucymc-test -storepass lucymc123 -keypass lucymc123 \
            -dname "CN=LucyMC Perf Test"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign release APK with ephemeral key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks lucymc-test.jks --ks-pass pass:lucymc123 --key-pass pass:lucymc123 \
            --out app/build/outputs/apk/release/app-release-perf.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release-perf.apk && echo "SIGNED+VERIFIED"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lucymc-release-perf
          path: app/build/outputs/apk/release/app-release-perf.apk
